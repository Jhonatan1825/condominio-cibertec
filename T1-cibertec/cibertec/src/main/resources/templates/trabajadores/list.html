<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trabajadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Trabajadores</h2>
<a th:href="@{/vista/trabajadores/nuevo}" class="btn btn-primary mb-3">+ Nuevo trabajador</a>

<table class="table table-bordered">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>DNI</th>
        <th>Teléfono</th>
        <th>Correo</th>
        <th>Cargo</th>
        <th>Turno</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${trabajadores}">
        <td th:text="${t.idTrabajador}"></td>
        <td th:text="${t.nombre}"></td>
        <td th:text="${t.apellido}"></td>
        <td th:text="${t.dni}"></td>
        <td th:text="${t.telefono}"></td>
        <td th:text="${t.correo}"></td>
        <td th:text="${t.cargo}"></td>
        <td th:text="${t.turno}"></td>
        <td th:text="${t.estado} ? 'Activo' : 'Inactivo'"></td>
        <td>
            <a th:href="@{/vista/trabajadores/editar/{id}(id=${t.idTrabajador})}" class="btn btn-sm btn-warning">Editar</a>
            <form th:action="@{/vista/trabajadores/eliminar/{id}(id=${t.idTrabajador})}" method="post" style="display:inline">
                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar este trabajador?')">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(trabajadores)}" class="text-muted">No hay trabajadores registrados.</p>

</body>
</html>
