<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Trabajador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Nuevo trabajador</h2>

<form th:action="@{/vista/trabajadores/nuevo}" method="post">

    <div class="mb-3">
        <label>Nombre</label>
        <input type="text" name="nombre" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Apellido</label>
        <input type="text" name="apellido" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>DNI</label>
        <input type="text" name="dni" class="form-control" pattern="\d{8}" title="Debe tener 8 dígitos" required>
    </div>

    <div class="mb-3">
        <label>Teléfono</label>
        <input type="text" name="telefono" class="form-control" pattern="9\d{8}" title="Debe tener 9 dígitos y comenzar con 9" required>
    </div>

    <div class="mb-3">
        <label>Correo</label>
        <input type="email" name="correo" class="form-control">
    </div>

    <div class="mb-3">
        <label>Cargo</label>
        <input type="text" name="cargo" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Turno</label>
        <input type="text" name="turno" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-success">Guardar</button>
    <a th:href="@{/vista/trabajadores}" class="btn btn-secondary">Cancelar</a>
</form>

</body>
</html>
